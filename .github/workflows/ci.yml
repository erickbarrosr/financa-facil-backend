name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build, Test & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Checkstyle
        run: mvn checkstyle:check --no-transfer-progress

      - name: SpotBugs
        run: mvn spotbugs:check --no-transfer-progress

      - name: Unit Tests
        run: mvn test -Dtest="!*IntegrationTest" --no-transfer-progress

      - name: Integration Tests
        run: mvn test -Dtest="*IntegrationTest" --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: JaCoCo Coverage Report
        run: mvn jacoco:report jacoco:check --no-transfer-progress

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Build Docker Image
        run: docker build -t financafacil-backend:ci .

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'financafacil-backend:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
